<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:wicket="http://wicket.apache.org"
      xml:lang="en"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
</head>
<body>
<wicket:panel>
    <div>
        <form wicket:id="searchForm">
            <div class="form-group">
                <label wicket:for="path">Pad: </label>
                <input type="text" class="form-control" wicket:id="path" placeholder="Enter path to search">
            </div>
            <div class="form-group">
                <label wicket:for="sequenceType">Type of Sequence</label>
                <select class="form-control" wicket:id="sequenceType"/>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</wicket:panel>
</body>
</html>
