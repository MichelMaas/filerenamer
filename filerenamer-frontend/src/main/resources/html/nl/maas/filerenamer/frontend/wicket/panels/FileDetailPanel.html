<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8">
    <title>Modal Panel</title>
</head>
<body>
<wicket:panel>
    <form wicket:id="fileDetailForm">
        <div class="form-group">
            <h2>
                <input type="text" class="form-control-plaintext" wicket:id="dirName"/>
            </h2>
        </div>
        <div class="form-group">
            <label wicket:for="name">Name: </label>
            <input type="text" wicket:id="name" class="form-control-plaintext"/>
        </div>
        <div class="form-group">
            <label wicket:for="sequence">Sequence: </label>
            <select class="form-control" wicket:id="sequence"/>
        </div>
        <div class="form-group">
            <label wicket:for="newName">New name: </label>
            <input type="text" wicket:id="newName"/>
        </div>
        <div class="form-row">
            <button type="button" wicket:id="submit" class="btn btn-primary">Confirm</button>
            <button type="button" wicket:id="cancel" class="btn btn-primary">Cancel</button>
        </div>
    </form>
</wicket:panel>
</body>
</html>
