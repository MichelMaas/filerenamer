<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:wicket="http://wicket.apache.org"
      xml:lang="en"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<wicket:panel>
    <div class="accordion">
        <div wicket:id="folders">
            <button wicket:id="hidingButton" class="btn btn-primary btn-lg btn-block">
                <h2 accordion-header>
                    <wicket:container wicket:id="folderTitle"/>
                </h2>
            </button>
            <div wicket:id="hidingContainer" class="accordion-collapse collapse show">
                <div wicket:id="members" class="list-group">
                    <div wicket:id="member"/>
                </div>
            </div>
        </div>
    </div>
</wicket:panel>
</body>
</html>
